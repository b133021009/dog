        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Skeleton loader shimmer effect */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Aspect ratio container to prevent Layout Shift (CLS) */
        .aspect-card {
            aspect-ratio: 4 / 3;
            position: relative;
            overflow: hidden;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Card Hover Animations */
        .dog-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        /* Pulse glow for primary buttons */
        .glow-button:hover {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
    </style>

        // --- Application State ---
        const state = {
            selectedBreed: 'random',
            fetchedImageUrls: new Set(),
            isLoading: false,
            batchSize: 10
        };

        // --- API Service ---
        const DogAPI = {
            baseUrl: 'https://dog.ceo/api',

            async fetchAllBreeds() {
                const res = await fetch(`${this.baseUrl}/breeds/list/all`);
                if (!res.ok) throw new Error('無法載入品種清單');
                const data = await res.json();
                return data.message;
            },

            async fetchImages(breed = 'random', count = 10) {
                let endpoint = '';
                if (breed === 'random') {
                    endpoint = `${this.baseUrl}/breeds/image/random/${count}`;
                } else {
                    endpoint = `${this.baseUrl}/breed/${breed}/images/random/${count}`;
                }

                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('無法從 Dog CEO 取得照片');
                const data = await res.json();
                
                return Array.isArray(data.message) ? data.message : [data.message];
            }
        };

        // --- Utility Helpers ---
        const Utils = {
            // 轉換英文品種與子品種為中文（附帶英文標示）
            getBreedChineseLabel(mainBreed, subBreed = null) {
                const mainEng = mainBreed.toLowerCase();
                const mainTW = breedTranslations[mainEng] || (mainBreed.charAt(0).toUpperCase() + mainBreed.slice(1));

                if (!subBreed) {
                    return `${mainTW} (${mainBreed.charAt(0).toUpperCase() + mainBreed.slice(1)})`;
                }

                const subEng = subBreed.toLowerCase();
                const subTW = breedTranslations.sub[subEng] || (subBreed.charAt(0).toUpperCase() + subBreed.slice(1));
                const fullEng = `${subBreed.charAt(0).toUpperCase() + subBreed.slice(1)} ${mainBreed.charAt(0).toUpperCase() + mainBreed.slice(1)}`;

                // 特殊中文組合邏輯
                if (mainEng === 'retriever' && subEng === 'golden') return `黃金獵犬 (${fullEng})`;
                if (mainEng === 'collie' && subEng === 'border') return `邊境牧羊犬 (${fullEng})`;
                if (mainEng === 'corgi') return `${subTW}柯基犬 (${fullEng})`;

                return `${subTW}${mainTW} (${fullEng})`;
            },

            // 從圖片 URL 解析品種並回傳中文名稱
            extractBreedFromUrl(url) {
                try {
                    const match = url.match(/\/breeds\/([^\/]+)\//);
                    if (!match) return '可愛狗狗';
                    
                    const rawBreed = match[1];
                    const parts = rawBreed.split('-');
                    
                    if (parts.length > 1) {
                        return this.getBreedChineseLabel(parts[0], parts[1]);
                    }
                    
                    return this.getBreedChineseLabel(parts[0]);
                } catch (e) {
                    return '可愛狗狗';
                }
            },

            getFallbackImage() {
                return 'https://placehold.co/600x450/1e293b/94a3b8?text=🐶+照片載入失敗';
            }

                btnDownload: document.getElementById('btnDownload')

            renderSkeletons(count = 10, append = false) {
                if (!append) {
                    this.elements.dogGrid.innerHTML = '';
                }

                const skeletonHTML = Array.from({ length: count }).map(() => `
                    <div class="dog-card glass rounded-2xl overflow-hidden border border-slate-800 skeleton-card">
                        <div class="aspect-card skeleton"></div>
                        <div class="p-3.5 space-y-2">
                            <div class="h-4 bg-slate-700/50 rounded-md w-2/3 skeleton"></div>
                            <div class="h-3 bg-slate-800/50 rounded-md w-1/3 skeleton"></div>
                        </div>
                    </div>
                `).join('');

                this.elements.dogGrid.insertAdjacentHTML('beforeend', skeletonHTML);
            },

            removeSkeletons() {
                const skeletons = this.elements.dogGrid.querySelectorAll('.skeleton-card');
                skeletons.forEach(el => el.remove());
            },

                const select = this.elements.breedSelect;
                const fragment = document.createDocumentFragment();

                Object.keys(breedsObj).sort().forEach(breed => {
                    const subBreeds = breedsObj[breed];
                    
                    if (subBreeds.length === 0) {
                        const opt = document.createElement('option');
                        opt.value = breed;
                        opt.textContent = `🐾 ${Utils.getBreedChineseLabel(breed)}`;
                        fragment.appendChild(opt);
                    } else {
                        // 主品種選項
                        const mainOpt = document.createElement('option');
                        mainOpt.value = breed;
                        mainOpt.textContent = `🐾 ${Utils.getBreedChineseLabel(breed)} - 全部子品種`;
                        fragment.appendChild(mainOpt);

                        // 子品種選項
                        subBreeds.forEach(sub => {
                            const subOpt = document.createElement('option');
                            subOpt.value = `${breed}/${sub}`;
                            subOpt.textContent = `└ ${Utils.getBreedChineseLabel(breed, sub)}`;
                            fragment.appendChild(subOpt);
                        });
                    }
                });

                select.appendChild(fragment);
            },

            renderDogCards(urls, append = false) {
                this.removeSkeletons();

                if (!append) {
                    this.elements.dogGrid.innerHTML = '';
                }

                if (urls.length === 0 && this.elements.dogGrid.children.length === 0) {
                    this.elements.emptyState.classList.remove('hidden');
                    return;
                } else {
                    this.elements.emptyState.classList.add('hidden');
                }

                const fragment = document.createDocumentFragment();

                urls.forEach(url => {
                    const breedName = Utils.extractBreedFromUrl(url);
                    
                    const card = document.createElement('div');
                    card.className = 'dog-card glass rounded-2xl overflow-hidden border border-slate-800/80 group cursor-pointer flex flex-col justify-between';
                    
                    card.innerHTML = `
                        <div class="aspect-card bg-slate-900 relative overflow-hidden">
                            <img 
                                src="${url}" 
                                alt="${breedName}" 
                                loading="lazy"
                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 opacity-0 transition-opacity duration-300"
                                onload="this.classList.remove('opacity-0')"
                                onerror="this.onerror=null; this.src='${Utils.getFallbackImage()}'; this.classList.remove('opacity-0');"
                            />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                                <span class="text-xs font-medium text-white flex items-center gap-1.5">
                                    <i class="fa-solid fa-magnifying-glass-plus text-brand-400"></i> 點擊查看大圖
                                </span>
                            </div>
                        </div>
                        <div class="p-3.5 flex items-center justify-between gap-2 border-t border-slate-800/60 bg-slate-900/40">
                            <span class="text-xs font-semibold text-slate-200 truncate" title="${breedName}">
                                ${breedName}
                            </span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700/50">
                                Dog CEO
                            </span>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        this.openModal(url, breedName);
                    });

                    fragment.appendChild(card);
                });

                this.elements.dogGrid.appendChild(fragment);
                this.updateCounter();
            },

            updateCounter() {
                this.elements.loadedCounter.textContent = state.fetchedImageUrls.size;
            },

            setLoading(loading) {
                state.isLoading = loading;
                const { btnLoadMore, loadMoreSpinner, loadMoreIcon, loadMoreText } = this.elements;

                if (loading) {
                    btnLoadMore.disabled = true;
                    loadMoreSpinner.classList.remove('hidden');
                    loadMoreIcon.classList.add('hidden');
                    loadMoreText.textContent = '正在獲取照片...';
                } else {
                    btnLoadMore.disabled = false;
                    loadMoreSpinner.classList.add('hidden');
                    loadMoreIcon.classList.remove('hidden');
                    loadMoreText.textContent = `再載入 ${state.batchSize} 張狗狗`;
                }
            },

            showError(message) {
                this.removeSkeletons();
                this.elements.errorMessage.textContent = message || '無法連線至 Dog CEO API。';
                this.elements.errorAlert.classList.remove('hidden');
            },

            hideError() {
                this.elements.errorAlert.classList.add('hidden');
            },

            openModal(url, breedName) {
                this.elements.modalImage.src = url;
                this.elements.modalBreedTitle.textContent = breedName;
                this.elements.btnDownload.href = url;

                this.elements.imageModal.classList.remove('pointer-events-none');
                this.elements.imageModal.classList.remove('opacity-0');
                this.elements.modalDialog.classList.remove('scale-95');
                this.elements.modalDialog.classList.add('scale-100');
                
                document.body.style.overflow = 'hidden';
            },

            closeModal() {
                this.elements.imageModal.classList.add('opacity-0');
                this.elements.imageModal.classList.add('pointer-events-none');
                this.elements.modalDialog.classList.remove('scale-100');
                this.elements.modalDialog.classList.add('scale-95');
                
                document.body.style.overflow = '';
            }
        };

        // --- App Controller & Main Execution ---
        const App = {
            async init() {
                this.bindEvents();
                await this.loadBreedsCatalog();
                await this.fetchDogBatch({ reset: true });
            },

            bindEvents() {
                // 切換品種下拉選單
                UI.elements.breedSelect.addEventListener('change', (e) => {
                    state.selectedBreed = e.target.value;
                    if (state.selectedBreed !== 'random') {
                        UI.elements.btnClearFilter.classList.remove('hidden');
                    } else {
                        UI.elements.btnClearFilter.classList.add('hidden');
                    }
                    this.fetchDogBatch({ reset: true });
                });

                // 重置篩選按鈕
                UI.elements.btnClearFilter.addEventListener('click', () => {
                    UI.elements.breedSelect.value = 'random';
                    state.selectedBreed = 'random';
                    UI.elements.btnClearFilter.classList.add('hidden');
                    this.fetchDogBatch({ reset: true });
                });

                // 刷新這批照片
                UI.elements.btnRefresh.addEventListener('click', () => {
                    this.fetchDogBatch({ reset: true });
                });

                // 再載入 10 張
                UI.elements.btnLoadMore.addEventListener('click', () => {
                    if (!state.isLoading) {
                        this.fetchDogBatch({ reset: false });
                    }
                });

                // 錯誤重試按鈕
                UI.elements.btnRetry.addEventListener('click', () => {
                    this.fetchDogBatch({ reset: true });
                });

                // 點擊 Logo 重置
                document.getElementById('brandLogo').addEventListener('click', () => {
                    UI.elements.breedSelect.value = 'random';
                    state.selectedBreed = 'random';
                    UI.elements.btnClearFilter.classList.add('hidden');
                    this.fetchDogBatch({ reset: true });
                });

                // Modal 關閉事件
                UI.elements.btnCloseModal.addEventListener('click', () => UI.closeModal());
                UI.elements.modalBackdrop.addEventListener('click', () => UI.closeModal());

                // 按 Escape 鍵關閉 Modal
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        UI.closeModal();
                    }
                });
            },

            // 載入全品種目錄
            async loadBreedsCatalog() {
                try {
                    const breeds = await DogAPI.fetchAllBreeds();
                    UI.populateBreedsDropdown(breeds);
                } catch (err) {
                    console.warn('無法取得品種清單，切換為預設隨機模式。', err);
                }
            },

            // 批次取得狗狗照片（帶 Set 去重機制）
            async fetchDogBatch({ reset = false }) {
                if (reset) {
                    state.fetchedImageUrls.clear();
                    UI.elements.dogGrid.innerHTML = '';
                    UI.hideError();
                }

                UI.setLoading(true);
                UI.renderSkeletons(state.batchSize, !reset);

                try {
                    const rawUrls = await DogAPI.fetchImages(state.selectedBreed, state.batchSize);
                    
                    // 利用 Set 防重複，過濾重複 URL
                    const newUniqueUrls = [];
                    rawUrls.forEach(url => {
                        if (!state.fetchedImageUrls.has(url)) {
                            state.fetchedImageUrls.add(url);
                            newUniqueUrls.push(url);
                        }
                    });

                    UI.hideError();
                    UI.renderDogCards(newUniqueUrls, !reset);

                } catch (error) {
                    console.error('API 錯誤:', error);
                    UI.showError(error.message);
                } finally {
                    UI.setLoading(false);
                }
            }
        };

        // DOM 載入後啟動應用程式
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
